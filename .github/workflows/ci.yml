name: Frontend CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Evaluate authority recommendations
        working-directory: frontend
        run: npm run eval:authorities

      - name: Evaluate privacy filter
        working-directory: frontend
        run: npm run eval:privacy

      - name: Build
        working-directory: frontend
        run: npm run build
